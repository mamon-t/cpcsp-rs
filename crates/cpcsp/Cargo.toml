[package]
name = "cpcsp"
description = "Safe Rust wrapper for CryptoPro CSP 5.0"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cpcsp-ffi-linux = { version = "0.2.1", path = "../cpcsp-ffi-linux" }

[target.'cfg(target_os = "windows")'.dependencies]
cpcsp-ffi-windows = { version = "0.0.0", path = "../cpcsp-ffi-windows" }

[dependencies]
thiserror = "2"
zeroize = "1"

[dev-dependencies]
hex = "0.4"


